name: Release

# 手動で push したバージョンタグ（例: v0.2.0）だけをトリガーにする。
# バージョンは package.json を明示的に上げてからタグを打つ運用。CI は自動で version を上げない。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      # タグ名と package.json の version が一致しているか検証（不一致ならリリースを止める）。
      # 自動で version は変更しない。
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} が package.json の version ${PKG_VERSION} と一致しません。package.json を上げてから 'git tag ${PKG_VERSION}' を打ってください。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # extraResources で mcp/node_modules を同梱するため、mcp 側の依存もインストールする。
      - name: Install MCP server dependencies
        run: npm ci --prefix mcp

      # npm run build = build:native (swiftc) + build:text-engine + electron-builder。
      # 署名証明書を持たないため自動署名は無効化（未署名 DMG を生成）。
      # electron-builder は git タグ起動だと暗黙で GitHub publish を試みるため、
      # --publish never で抑止する（リリース作成は後段の action-gh-release が担当）。
      - name: Build DMG installers
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: millrect-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # GitHub Release を draft で作成し DMG を添付する。
      # draft なので内容を確認してから手動で公開する（誤公開を防ぐ）。
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.dmg
